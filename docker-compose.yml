services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - annotation-data:/data

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  annotation-data:
  frontend-node-modules:
